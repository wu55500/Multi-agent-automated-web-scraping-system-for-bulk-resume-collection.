<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>dz 求职作战台 · B 版</title>
<style>
:root{--bg:#0f1420;--card:#1a2130;--fg:#e8ecf4;--dim:#8b94a7;--acc:#5ea0ff;--ok:#3ddc84;--warn:#ffb454}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,sans-serif}
header{position:sticky;top:0;background:var(--bg);border-bottom:1px solid #232b3d;padding:10px 12px;z-index:5}
header h1{margin:0;font-size:17px}
header .row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
input,select,button{background:var(--card);color:var(--fg);border:1px solid #2c3650;border-radius:8px;padding:6px 10px;font-size:14px}
button.on{background:var(--acc);color:#06121f;border-color:var(--acc);font-weight:600}
main{padding:12px}
.card{background:var(--card);border:1px solid #232b3d;border-radius:10px;padding:12px;margin-bottom:10px}
h2{font-size:15px;margin:2px 0 8px}
.dim{color:var(--dim);font-size:12px}
.bar{display:flex;align-items:center;gap:8px;margin:4px 0}
.bar .lab{width:110px;flex:none;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .track{flex:1;background:#10151f;border-radius:6px;height:16px;overflow:hidden}
.bar .fill{height:100%;background:linear-gradient(90deg,#3a7bd5,#5ea0ff);border-radius:6px}
.bar .n{width:52px;flex:none;text-align:right;color:var(--dim);font-size:12px}
.chip{display:inline-block;background:#232c42;border-radius:20px;padding:2px 9px;margin:2px 3px 2px 0;font-size:12px;cursor:pointer}
.ev{margin-bottom:10px}
.ev .q{border-left:3px solid var(--acc);padding-left:8px;color:#cdd6e6;font-size:13px}
.ev .src{color:var(--dim);font-size:12px;margin-top:3px}
.miss{color:var(--warn)} .have{color:var(--ok)}
.big{font-size:22px;font-weight:700}
.kpis{display:flex;gap:10px;flex-wrap:wrap}
.kpi{flex:1;min-width:90px;background:#10151f;border-radius:10px;padding:10px;text-align:center}
.kpi .lab{color:var(--dim);font-size:12px}
footer{color:var(--dim);font-size:12px;text-align:center;padding:14px}
</style>
</head>
<body>
<header>
  <h1>dz 求职作战台 · B 版</h1>
  <div class="row">
    <select id="src">
      <option value="">全部（国内渠道）</option>
      <option value="boss-longgang-2026-08">boss 数据集</option>
    </select>
    <input id="role-quick" placeholder="输入岗位名搜索岗位，如 Java" style="flex:1">
    <button id="q-go">搜索</button>
    <button id="go">刷新</button>
  </div>
  <div class="row">
    <button data-v="jobs" class="on">岗位</button>
    <button data-v="graph">图谱</button>
    <button data-v="ev">证据</button>
    <button data-v="gap">差距</button>
    <button data-v="runs">轮次</button>
    <button data-v="prof">画像</button>
  </div>
  <div class="dim" style="font-size:12px;margin-top:2px">岗位=逐条岗位明细（可搜索）· 图谱=技能热度与共现 · 证据=技能命中原文 · 差距=我的技能缺口 · 画像=按岗位名出统计+开源项目证据+Agent趋势</div>
</header>
<main>
  <section id="v-jobs"></section>
  <section id="v-graph" style="display:none"></section>
  <section id="v-ev" style="display:none"></section>
  <section id="v-gap" style="display:none"></section>
  <section id="v-runs" style="display:none"></section>
  <section id="v-prof" style="display:none">
    <div class="card"><h2>岗位画像：输入岗位名 → 全库技术栈统计 → 开源项目证据</h2>
      <div class="dim">岗位名支持族别名与组合：Java、AI+爬虫、Python+Java+agent、AI+大数据、AI+运维、AI+测试、全栈……</div>
      <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center">
        <input id="prof-role" placeholder="如：AI+爬虫" style="flex:1">
        <label style="font-size:13px"><input id="prof-easy" type="checkbox" checked> 只看低门槛（不要求985/211/硕博/竞赛）</label>
        <button id="prof-go" class="on">查画像</button>
      </div>
    </div>
    <div id="prof-out"></div>
  </section>
</main>
<footer>数据来自 dz 本地库 · 只读接口 · 投递永远由人来做</footer>
<script>
const $ = function(s){ return document.querySelector(s); };
document.querySelector("#src").value = localStorage.getItem("dz_src") || "";
document.querySelector("#src").onchange = function(e){ localStorage.setItem("dz_src", e.target.value); };

async function api(path) {
  const r = await fetch(path);
  const j = await r.json();
  if (!j.ok) throw new Error(j.err || ("HTTP " + r.status));
  return j.data;
}
function srcq() { const s = document.querySelector("#src").value; return s ? "&source=" + encodeURIComponent(s) : ""; }
function esc(s) { return String(s || "").replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

async function vJobs() {
  const el = document.querySelector("#v-jobs");
  el.innerHTML = '<div class="dim">加载中…</div>';
  try {
    const d = await api("/api/stats");
    const qp = Q ? "&q=" + encodeURIComponent(Q) : "";
    const items = (await api("/api/jobs?limit=" + (Q ? 200 : 60) + qp + srcq())).items;
    let html = '<div class="card"><h2>库内总览</h2><div class="kpis">'
      + '<div class="kpi"><div class="big">' + (d.jobs ?? 0) + '</div><div class="lab">岗位</div></div>'
      + '<div class="kpi"><div class="big">' + (d.skills ?? 0) + '</div><div class="lab">技能命中</div></div>'
      + '<div class="kpi"><div class="big">' + (d.queued ?? 0) + '</div><div class="lab">投递队列</div></div>'
      + '<div class="kpi"><div class="big">' + (d.runs ?? 0) + '</div><div class="lab">自动化轮次</div></div>'
      + '</div></div>';
    if (Q) {
      html += '<div class="card"><h2>搜索「' + esc(Q) + '」</h2>'
        + '<div class="dim">命中 ' + items.length + ' 条岗位（标题含关键词）。'
        + '想看该岗位在全库的技术栈统计、开源项目证据与 Agent 趋势 → 点「去画像」。</div>'
        + '<div style="margin-top:8px"><button onclick="toProf()">去画像</button>'
        + '<button onclick="clearSearch()" style="margin-left:6px">清除搜索</button></div></div>';
    }
    el.innerHTML = html;
    for (const it of items) {
      el.insertAdjacentHTML("beforeend", '<div class="card"><h2>' + esc(it.zh || it.title) + '</h2>'
        + (it.zh && it.zh !== it.title ? '<div class="dim">原名: ' + esc(it.title) + '</div>' : "")
        + '<div class="dim">' + esc(it.company)
        + (it.site ? ' <a href="' + esc(it.site) + '" target="_blank" rel="noopener">官网</a>'
                   : ' <a href="https://www.baidu.com/s?wd=' + encodeURIComponent(it.company) + '" target="_blank" rel="noopener">搜官网</a>')
        + ' · ' + esc(it.city || "未知城市") + ' · ' + esc(it.source) + ' · ' + esc(it.family || "未归类") + '</div>'
        + '<div>' + (it.skills || []).slice(0, 10).map(function(s){ return '<span class="chip">' + esc(s) + '</span>'; }).join("") + '</div></div>');
    }
  } catch (e) { el.innerHTML = '<div class="card">接口错误：' + esc(e.message) + "</div>"; }
}

async function vGraph() {
  const el = document.querySelector("#v-graph");
  el.innerHTML = '<div class="dim">加载中…</div>';
  try {
    const d = await api("/api/graph?top=16" + srcq());
    let mx = 1;
    for (const x of d.nodes) mx = Math.max(mx, x.n);
    let html = '<div class="card"><h2>技能热度（岗位数）</h2>';
    for (const x of d.nodes)
      html += '<div class="bar"><span class="lab">' + esc(x.name) + '</span>'
        + '<span class="track"><span class="fill" style="width:' + (x.n / mx * 100).toFixed(1) + '%"></span></span>'
        + '<span class="n">' + x.n + '</span></div>';
    html += '</div><div class="card"><h2>技能共现（同一 JD 同时要求）</h2>';
    for (const c of d.cooc)
      html += '<div class="bar"><span class="lab">' + esc(c.an || c.a) + ' + ' + esc(c.bn || c.b) + '</span>'
        + '<span class="track"><span class="fill" style="width:' + (c.n / mx * 100).toFixed(1) + '%"></span></span>'
        + '<span class="n">' + c.n + '</span></div>';
    el.innerHTML = html + "</div>";
  } catch (e) { el.innerHTML = '<div class="card">接口错误：' + esc(e.message) + "</div>"; }
}

let SKILLS = [];
async function vEv() {
  const el = document.querySelector("#v-ev");
  el.innerHTML = '<div class="dim">加载中…</div>';
  try {
    if (!SKILLS.length) {
      const d = await api("/api/graph?top=40" + srcq());
      SKILLS = d.nodes;
    }
    let html = '<div class="card"><h2>证据视图：点技能看原文命中句</h2><div id="ev-chips">';
    for (const x of SKILLS)
      html += '<span class="chip" onclick="showEv(\'' + esc(x.cid) + '\')">' + esc(x.name) + '</span>';
    el.innerHTML = html + '</div></div><div id="ev-quotes"></div>';
  } catch (e) { el.innerHTML = '<div class="card">接口错误：' + esc(e.message) + "</div>"; }
}
window.toProf = function () {
  document.querySelector("#prof-role").value = Q || document.querySelector("#role-quick").value;
  pick("prof");
};
window.clearSearch = function () {
  Q = "";
  document.querySelector("#role-quick").value = "";
  pick("jobs");
};
window.showEv = async function (cid) {
  const box = document.querySelector("#ev-quotes");
  box.innerHTML = '<div class="dim">加载中…</div>';
  try {
    const d = await api("/api/evidence?skill=" + encodeURIComponent(cid) + "&limit=12");
    let html = "";
    for (const x of d.items)
      html += '<div class="ev"><div class="q">' + esc(x.evidence) + '</div>'
        + '<div class="src">' + esc(x.title) + ' · ' + esc(x.company) + ' · ' + esc(x.source) + '</div></div>';
    box.innerHTML = html;
  } catch (e) { box.innerHTML = "接口错误：" + esc(e.message); }
};

async function vGap() {
  const el = document.querySelector("#v-gap");
  el.innerHTML = '<div class="dim">加载中…</div>';
  try {
    const d = await api("/api/gap" + srcq());
    let html = '<div class="card"><h2>差距分析（对比我的技能清单）</h2>'
      + '<div class="dim">热门 Top10 覆盖率：<span class="big">' + (d.coverage_top10 * 100).toFixed(0) + '%</span></div></div>';
    html += '<div class="card"><h2>市场热、我没有（优先级学习）</h2>';
    for (const x of d.hot_lack.slice(0, 15))
      html += '<div class="bar"><span class="lab miss">' + esc(x.name) + '</span>'
        + '<span class="track"><span class="fill" style="width:' + Math.min(100, x.n / 3) + '%"></span></span>'
        + '<span class="n">' + x.n + '</span></div>';
    html += '</div><div class="card"><h2>我有的热门技能</h2>';
    for (const x of d.have_hot)
      html += '<div class="bar"><span class="lab have">' + esc(x.name) + '</span>'
        + '<span class="track"><span class="fill" style="width:' + Math.min(100, x.n / 3) + '%"></span></span>'
        + '<span class="n">#' + x.rank + ' · ' + x.n + '</span></div>';
    el.innerHTML = html + "</div>";
  } catch (e) { el.innerHTML = '<div class="card">接口错误：' + esc(e.message) + "</div>"; }
}

async function vRuns() {
  const el = document.querySelector("#v-runs");
  el.innerHTML = '<div class="dim">加载中…</div>';
  try {
    const d = await api("/api/runs?limit=40");
    let html = '<div class="card"><h2>自动化轮次日志（run_log）</h2><div class="dim">每次采集/评测/清洗都有留痕，失败轮次标红</div></div>';
    for (const x of d.items)
      html += '<div class="card"><h2>' + (x.ok ? '<span class="have">✓</span>' : '<span class="miss">✗</span>') + ' ' + esc(x.stage) + '</h2>'
        + '<div class="dim">' + esc(x.detail || "") + ' · ' + (x.cost_ms || 0) + 'ms</div></div>';
    el.innerHTML = html;
  } catch (e) { el.innerHTML = '<div class="card">接口错误：' + esc(e.message) + "</div>"; }
}

function md2html(md) {
  const esc2 = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const fm = s => esc2(s).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  let h = '';
  const lines = md.split(/\n/);
  let inTable = false, firstRow = true;
  for (let i = 0; i < lines.length; i++) {
    let s = lines[i];
    const tr = s.trim();
    if (!tr) { if (inTable) { h += '</table>'; inTable = false; } continue; }
    if (/^\|.*\|$/.test(tr)) {
      if (tr.match(/^\|[\s:|-]+\|$/)) continue;
      if (!inTable) { h += '<div class="wrap"><table>'; inTable = true; firstRow = true; }
      const cells = tr.slice(1, -1).split('|').map(c => c.trim());
      const tag = firstRow ? 'th' : 'td';
      firstRow = false;
      h += '<tr>' + cells.map(c => '<' + tag + '>' + fm(c) + '</' + tag + '>').join('') + '</tr>';
      continue;
    }
    if (inTable) { h += '</table></div>'; inTable = false; }
    let t = tr;
    if (/^#{1,3}\s/.test(t)) {
      const lvl = t.match(/^(#{1,3})\s/)[1].length;
      t = t.replace(/^#{1,3}\s/, '');
      h += '<h' + (lvl + 1) + ' style="margin:16px 0 6px">' + fm(t) + '</h' + (lvl + 1) + '>';
      continue;
    }
    if (/^[-*]\s/.test(t)) {
      t = t.replace(/^[-*]\s/, '');
      h += '<div style="padding:3px 0 3px 10px">· ' + fm(t) + '</div>';
      continue;
    }
    h += '<div style="padding:3px 0">' + fm(t) + '</div>';
  }
  if (inTable) h += '</table></div>';
  return h;
}

async function vProf() {
  const el = document.querySelector("#v-prof");
  const out = document.querySelector("#prof-out");
  if (out.innerHTML) return;
  document.querySelector("#prof-go").onclick = async function () {
    const role = document.querySelector("#prof-role").value.trim();
    if (!role) return;
    const easy = document.querySelector("#prof-easy").checked;
    out.innerHTML = '<div class="dim">查询中…（全库聚合，几秒钟）</div>';
    try {
      const d = await api("/api/profile?role=" + encodeURIComponent(role) + (easy ? "&easy=1" : ""));
      out.innerHTML = '<div class="card">' + md2html(d.markdown) + '</div>';
    } catch (e) { out.innerHTML = '<div class="card">接口错误：' + esc(e.message) + '</div>'; }
  };
  document.querySelector("#prof-role").onkeydown = function (e) {
    if (e.key === "Enter") document.querySelector("#prof-go").click();
  };
}

const VIEWS = { jobs: vJobs, graph: vGraph, ev: vEv, gap: vGap, runs: vRuns, prof: vProf };
const btns = document.querySelectorAll("button[data-v]");
function pick(v) {
  for (const x of btns) x.classList.remove("on");
  document.querySelector("button[data-v='" + v + "']").classList.add("on");
  for (const k in VIEWS) document.querySelector("#v-" + k).style.display = (k === v) ? "" : "none";
  VIEWS[v]();
}
for (const b of btns) b.onclick = function(){ pick(b.dataset.v); };
document.querySelector("#go").onclick = function(){
  const on = document.querySelector("button.on");
  if (on) pick(on.dataset.v);
};
let Q = "";
function doSearch() {
  Q = document.querySelector("#role-quick").value.trim();
  pick("jobs");
}
document.querySelector("#q-go").onclick = doSearch;
document.querySelector("#role-quick").onkeydown = function(e){
  if (e.key === "Enter") doSearch();
};
vJobs();
</script>
</body>
</html>
