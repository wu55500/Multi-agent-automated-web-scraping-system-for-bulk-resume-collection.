<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>岗位技术栈与投递工作台</title>
<style>body{font:16px system-ui;margin:auto;padding:24px;max-width:1100px;background:#101826;color:#e5edf8}h1{font-size:26px}button,input,select{font:inherit;padding:10px;margin:4px;border-radius:8px;border:1px solid #66758c}button{background:#75dfca;cursor:pointer}input{max-width:80%}pre{white-space:pre-wrap;overflow-wrap:anywhere}section{background:#1b293c;padding:18px;margin-top:18px;border-radius:14px}.row{border-bottom:1px solid #526178;padding:12px}small{color:#acc0d9}#error{color:#ffb1a6}</style>
<h1>岗位技术栈与投递工作台</h1><p>来源可追溯 · 版本可核对 · 投递需确认</p>
<section><label>访问令牌 <input id="token" type="password" autocomplete="off"></label><button id="load">载入</button><small>令牌仅保存在当前页面内存，刷新后清除。</small></section>
<section><button data-tab="jobs">岗位</button><button data-tab="sources">来源</button><button data-tab="health">采集健康</button><button data-tab="coverage">覆盖率</button><button data-tab="applications">投递</button><button data-tab="drift">技能变化</button><button data-tab="audit">审计</button><input id="query" placeholder="岗位关键词"><button id="search">搜索</button></section>
<section><b>计算覆盖率</b><p>零重叠只展示观测数量。未经统计假设核查，不显示市场覆盖百分比。</p><input id="a" placeholder="来源 A"><input id="b" placeholder="来源 B"><button id="coverage">计算观测数量</button></section>
<section><b>准备投递材料</b><p>输入岗位 ID 和真实履历 JSON。创建后在投递页核对材料，再确认授权。</p><input id="posting" placeholder="岗位 ID"><textarea id="resume" rows="5" style="width:95%" placeholder='{"facts":[{"text":"真实项目经历","evidence":"材料引用"}]}'></textarea><button id="prepare">保存待确认投递</button></section>
<p id="error" role="alert"></p><section id="output" aria-live="polite">请载入你的令牌。首次使用需通过命令行注册来源和导入数据。</section>
<script>
const $=id=>document.getElementById(id);let tab='jobs';
async function api(path,data){const r=await fetch('/api/'+path,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+$('token').value,...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined});const j=await r.json();if(!r.ok)throw Error(j.error||r.status);return j.data}
function show(data){$('output').replaceChildren();for(const item of Array.isArray(data)?data:[data]){const el=document.createElement('pre');el.className='row';el.textContent=JSON.stringify(item,null,2);$('output').append(el);if(item&&item.state==='draft'&&item.resume_hash){const b=document.createElement('button');b.textContent='核对后批准此版本（1小时）';b.onclick=async()=>{if(!confirm('我已核对显示的岗位、简历内容和事实引用，批准此版本用于投递。'))return;try{await api('approve',{id:item.id,resume_hash:item.resume_hash});tab='applications';load()}catch(e){$('error').textContent=e.message}};$('output').append(b)}}if(Array.isArray(data)&&!data.length)$('output').textContent='暂无记录；尚未采集不等于健康或覆盖率为零。'}
async function load(){try{$('error').textContent='';show(await api(tab+(tab==='jobs'?'?q='+encodeURIComponent($('query').value):'')))}catch(e){$('error').textContent=e.message}}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;load()});$('load').onclick=load;$('search').onclick=()=>{tab='jobs';load()};$('coverage').onclick=async()=>{try{show(await api('coverage',{a:$('a').value,b:$('b').value}))}catch(e){$('error').textContent=e.message}};
$('prepare').onclick=async()=>{try{show(await api('prepare',{posting:$('posting').value,resume:JSON.parse($('resume').value)}))}catch(e){$('error').textContent=e.message}};
</script></html>
